
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form Pendaftaran Diklat</title>

    <link rel="stylesheet" href="./css/style2.css">
</head>

<body class="halaman-daftar">

    <!-- JUDUL HALAMAN -->
    <header>
        <h1>Form Pendaftaran Peserta Diklat</h1>
        <p>Junior Web Programmer</p>
    </header>

    <!-- NAVIGASI -->
    <nav aria-label="Navigasi utama">
        <a href="index.html">Beranda</a>
        <a href="jadwal.html">Jadwal</a>
        <a href="daftar.html">Pendaftaran</a>
    </nav>

    <main>
        <section>

            <h2>Silakan Isi Data Pendaftaran</h2>
            <p>Kolom bertanda * wajib diisi.</p>

            <!-- FORM UTAMA -->
            <form
                action="proses.php"
                method="post"
                enctype="multipart/form-data"
            >

                <!-- DATA DIRI -->
                <fieldset>
                    <legend>Data Diri</legend>

                    <div class="form-row">
                        <label for="nama">
                            Nama Lengkap *
                        </label>

                        <input
                            type="text"
                            id="nama"
                            name="nama"
                            placeholder="Masukkan nama lengkap"
                            required
                        >
                    </div>

                    <div class="form-row">
                        <label for="email">
                            Email *
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="nama@contoh.com"
                            required
                        >
                    </div>

                    <div class="form-row">
                        <label for="hp">
                            Nomor HP *
                        </label>

                        <input
                            type="tel"
                            id="hp"
                            name="hp"
                            placeholder="081234567890"
                            pattern="08[0-9]{10}"
                            minlength="12"
                            maxlength="12"
                            title="Nomor HP harus 12 digit dan diawali 08"
                            required
                        >
                    </div>

                    <div class="form-row">
                        <label for="tanggal_lahir">
                            Tanggal Lahir *
                        </label>

                        <input
                            type="date"
                            id="tanggal_lahir"
                            name="tanggal_lahir"
                            required
                        >
                    </div>

                    <fieldset class="options">
                        <legend>Jenis Kelamin *</legend>

                        <label>
                            <input
                                type="radio"
                                name="jenis_kelamin"
                                value="Laki-laki"
                                required
                            >
                            Laki-laki
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="jenis_kelamin"
                                value="Perempuan"
                            >
                            Perempuan
                        </label>
                    </fieldset>

                </fieldset>

                <!-- PILIHAN KELAS -->
                <fieldset>
                    <legend>Pilihan Kelas</legend>

                    <div class="form-row">
                        <label for="kelas">Kelas *</label>

                        <select
                            id="kelas"
                            name="kelas"
                            required
                        >
                            <option value="">
                                -- Pilih kelas --
                            </option>

                            <option value="Web Programming">
                                Web Programming
                            </option>

                            <option value="Data Dasar">
                                Data Dasar
                            </option>
                        </select>
                    </div>
                </fieldset>

                <!-- MINAT BELAJAR -->
                <fieldset class="options">
                    <legend>Minat Belajar</legend>

                    <label>
                        <input
                            type="checkbox"
                            name="minat[]"
                            value="Frontend"
                        >
                        Frontend
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="minat[]"
                            value="Backend"
                        >
                        Backend
                    </label>
                </fieldset>

                <!-- ALAMAT -->
                <div class="form-row">
                    <label for="alamat">Alamat *</label>

                    <textarea
                        id="alamat"
                        name="alamat"
                        rows="4"
                        placeholder="Masukkan alamat lengkap"
                        required
                    ></textarea>
                </div>

                <!-- UNGGAH FOTO -->
                <div class="form-row">
                    <label for="foto">
                        Foto (JPG/PNG) *
                    </label>

                    <input
                        type="file"
                        id="foto"
                        name="foto"
                        accept=".jpg,.jpeg,.png"
                        required
                    >
                </div>

                <!-- PERSETUJUAN -->
                <div class="form-row">
                    <label>
                        <input
                            type="checkbox"
                            name="persetujuan"
                            value="ya"
                            required
                        >
                        Data yang saya isi benar *
                    </label>
                </div>

                <!-- TOMBOL -->
                <div class="form-actions">

                    <button type="submit">
                        Daftar
                    </button>

                    <button type="reset">
                        Atur Ulang
                    </button>

                </div>

            </form>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Diklat Junior Web Programmer</p>
    </footer>

</body>
</html>
