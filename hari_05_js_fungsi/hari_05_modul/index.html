
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 4 - Modul ES</title>
</head>

<body>

  <h1>Pengolah Nilai Siswa</h1>
  <p>Masukkan nilai dengan pemisah koma.</p>

  <form id="form-nilai">

    <label for="input-nilai">Daftar Nilai:</label>

    <input
      type="text"
      id="input-nilai"
      placeholder="Contoh: 80, 90, 70"
      required
    >

    <button type="submit">Hitung Nilai</button>

  </form>

  <p id="pesan" role="alert"></p>

  <section id="hasil" hidden>
    <h2>Hasil Perhitungan</h2>

    <p>Data nilai:
      <span id="daftar-nilai"></span>
    </p>

    <p>Rata-rata:
      <span id="hasil-rata-rata"></span>
    </p>

    <p>Nilai tertinggi:
      <span id="hasil-tertinggi"></span>
    </p>

    <p>Nilai terendah:
      <span id="hasil-terendah"></span>
    </p>
  </section>

  <!-- Memuat JavaScript sebagai ES Module -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
